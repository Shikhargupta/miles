# Dumps inside the gated-delta-net so the step that loses determinism can be
# named. Kept as a source patch rather than edits to miles_plugins/models/qwen3_5.py
# because that file is shared with Qwen3.5 and these are debug-only.
#
# No dims annotations: these are compared rank-to-rank within one run
# (tools/rankcheck.py), where the invariant is simply that a duplicated module
# produces identical values on every rank. Cross-framework comparison of these
# points would need dims; rank agreement does not.
patches:
  - target: "miles_plugins.models.qwen3_5.Qwen3_5GatedDeltaNet.forward"
    edits:
      - match: |
          mixed_qkv, _ = self.conv1d(
              x=mixed_qkv,
              cu_seqlens=conv_cu_seqlens,
              cp_context=cp_context,
          )
        append: |
          dumper.dump(f"gdn{self.layer_idx:02d}.conv", mixed_qkv)
      - match: |
          core_attn_out, _ = self.chunk_gated_delta_rule(
              query,
              key,
              value,
              g=g,
              beta=beta,
              initial_state=None,
              output_final_state=False,
              use_qk_l2norm_in_kernel=True,
              cu_seqlens=cu_seqlens,
          )
        append: |
          dumper.dump(f"gdn{self.layer_idx:02d}.core", core_attn_out)
      - match: |
          core_attn_out = self.norm(core_attn_out, z)
        append: |
          dumper.dump(f"gdn{self.layer_idx:02d}.norm", core_attn_out)
      - match: |
          output = self.out_proj(core_attn_out)
        append: |
          dumper.dump(f"gdn{self.layer_idx:02d}.out", output)
      - match: |
          beta = b.sigmoid()
        prepend: |
          dumper.dump(f"gdn{self.layer_idx:02d}.qkv", mixed_qkv)
