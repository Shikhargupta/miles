{{- if .Values.rbac.create }}
{{- $name := include "miles-workbench.clusterScopedName" . }}
{{- $uninstallerName := printf "%s-%s-%s" .Values.uninstaller.serviceAccount (include "miles-workbench.fullname" .) .Release.Namespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "miles-workbench.labels" . | nindent 4 }}
rules:
  {{- include "miles-workbench.clusterRoleRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "miles-workbench.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "miles-workbench.serviceAccountName" . | quote }}
    namespace: {{ .Release.Namespace | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $uninstallerName | quote }}
  labels:
    {{- include "miles-workbench.labels" . | nindent 4 }}
rules:
  {{- include "miles-workbench.uninstallerClusterRoleRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $uninstallerName | quote }}
  labels:
    {{- include "miles-workbench.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $uninstallerName | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.uninstaller.serviceAccount | quote }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
